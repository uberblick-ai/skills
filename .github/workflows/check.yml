name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install skills-ref
      - run: for s in skills/*/*/; do agentskills validate "$s"; done
      - run: python -m compileall -q skills
      - run: python -m unittest discover -s skills/maintenance/backlog-grooming/scripts -p "test_*.py"
      - run: python -m unittest discover -s skills/maintenance/ci-health/scripts -p "test_*.py"
      - run: python -m unittest discover -s skills/ub-agents/ub-agents-deliver-report/scripts -p "test_*.py"
      - run: python -m unittest discover -s skills/ub-agents/ub-agents-flow/scripts -p "test_*.py"
      - run: |
          npm install --prefix "$RUNNER_TEMP/ablauf" @uberblick/ablauf@0.2.0
          cp skills/ub-agents/ub-agents-flow/assets/*.flow "$RUNNER_TEMP"
          node skills/ub-agents/ub-agents-flow/scripts/render.mjs "$RUNNER_TEMP/ablauf" "$RUNNER_TEMP/overview.flow" "$RUNNER_TEMP/issue.flow" "$RUNNER_TEMP/pr.flow"
      - run: python scripts/check_marketplace.py
      - run: python site/build.py
      - run: npx -y skills@latest add . --list
        env:
          DISABLE_TELEMETRY: "1"
