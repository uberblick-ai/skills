name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install skills-ref
      - run: for s in skills/*/*/; do agentskills validate "$s"; done
      - run: python -m compileall -q skills
      - run: npx -y skills@latest add . --list
        env:
          DISABLE_TELEMETRY: "1"
